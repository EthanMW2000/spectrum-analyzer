# Drop-in for hifi-display.service: run the Rust display instead of hifi_display.py.
# Installed to /etc/systemd/system/hifi-display.service.d/rust.conf by switch-display.sh.
[Service]
ExecStart=
ExecStart=/home/ethanmw2000/spectrum-analyzer-rs/hifi-display
Environment=XDG_RUNTIME_DIR=/run/user/1000
Environment=WAYLAND_DISPLAY=wayland-0
