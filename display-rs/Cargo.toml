[package]
name = "hifi-display"
version = "0.1.0"
edition = "2024"

[dependencies]
alsa = "0.12.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = "0.4.45"
fontdue = "0.9.5"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
md5 = "0.8.1"
pollster = "1.0.3"
rand = "0.10.4"
realfft = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "gles"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle", "x11"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
